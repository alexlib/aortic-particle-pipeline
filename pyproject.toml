[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aortic-particle-pipeline"
version = "0.2.0"
description = "Self-contained filtration, Eulerian, and Lagrangian processing for aortic-phantom particle trajectories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyvista>=0.43",
  "scipy>=1.11",
  "zarr>=2.16",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
aorta-pipeline = "aorta_pipeline.cli:main"
aorta-gui = "aorta_pipeline.gui:main"
aorta-synthetic = "aorta_pipeline.synthetic:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aorta_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
